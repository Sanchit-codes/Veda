version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: vedaai-mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: vedaai
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vedaai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: vedaai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # Pull gemma4-e2b model on startup (optional, can be slow)
    command: ollama pull gemma4-e2b

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: vedaai-backend
    ports:
      - "4900:4900"
    environment:
      NODE_ENV: production
      PORT: 4900
      MONGODB_URI: mongodb://mongodb:27017/vedaai
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: vedaai-frontend
    ports:
      - "3020:3020"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4900/api
      NEXT_PUBLIC_WS_URL: http://localhost:4900
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
  ollama-data:
  uploads:
